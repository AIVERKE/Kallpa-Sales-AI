<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Kallpa Sales AI{% endblock %}</title>
    <!-- TailwindCSS (via CDN for Phase 1) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js (Lightweight Interactivity) -->
    <script src="//unpkg.com/alpinejs" defer></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-800">
    <!-- Mobile Navigation Overlay -->
    <div
      x-data="{ open: false }"
      class="relative z-50 lg:hidden"
      role="dialog"
      aria-modal="true"
    >
      <!-- Content here would be added for mobile menu logic -->
    </div>

    <div class="min-h-screen flex flex-col">
      <!-- Top Navigation -->
      <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16">
            <div class="flex">
              <div class="flex-shrink-0 flex items-center">
                <a href="/dashboard" class="text-xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
                  Kallpa AI
                </a>
              </div>
              <div class="hidden md:ml-6 md:flex md:space-x-8">
                <a href="/dashboard" class="border-transparent text-gray-500 hover:border-purple-300 hover:text-purple-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                  Inicio
                </a>
                <a href="/orders" class="border-transparent text-gray-500 hover:border-purple-300 hover:text-purple-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                  Pedidos
                </a>
                <a href="/inventory" class="border-transparent text-gray-500 hover:border-purple-300 hover:text-purple-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                  Inventario
                </a>
                <a href="/customers" class="border-transparent text-gray-500 hover:border-purple-300 hover:text-purple-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                  Clientes
                </a>
                <a href="/settings/delivery" class="border-transparent text-gray-500 hover:border-purple-300 hover:text-purple-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                  ⚙️ Envíos
                </a>
              </div>
            </div>
            <div class="flex items-center">
              {% if user %}
              <span class="text-sm text-gray-500 mr-4"
                >Hola, {{ user.full_name or 'Admin' }}</span
              >
              <a
                href="/logout"
                class="text-sm font-medium text-red-600 hover:text-red-500"
                >Salir</a
              >
              {% endif %}
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %} {% endblock %}
      </main>

      <!-- Footer -->
      <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
          <p class="text-center text-sm text-gray-400">
            &copy; 2026 Kallpa Sales AI. Hecho en La Paz.
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
